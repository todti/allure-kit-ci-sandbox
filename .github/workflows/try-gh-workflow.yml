name: Try allure gh-workflow

on:
  push:
    branches: [try-gh-workflow]

permissions:
  contents: read

jobs:
# Generated by "allure gh-workflow". Paste it under "jobs:" and adjust the TODO steps.
  test:
    name: Test (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ["foo", "bar", "baz"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: |
          npx allure run --config=./allurerc.json --environment=${{ matrix.environment }} --dump=allure-results-${{ matrix.environment }} -- npm test
      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.environment }}
          path: ./allure-results-${{ matrix.environment }}.zip

  report:
    name: Report
    needs: [test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Download Allure results
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: ./
      - name: Generate report
        run: |
          npx allure generate --config=./allurerc.json --dump="allure-results-*/*.zip" --output=./allure-report
      # verification only, not generated: keep the report to inspect it
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: ./allure-report
